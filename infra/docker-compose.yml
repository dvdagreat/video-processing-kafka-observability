services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_MESSAGE_MAX_BYTES: 20971520
      KAFKA_REPLICA_FETCH_MAX_BYTES: 20971520

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - zipkin

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
      - loki

  api-server:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: video-pipeline-backend:latest
    container_name: api-server
    command: ["api-server"]
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      STORAGE_ROOT: /data
      LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - video-storage:/data
    depends_on:
      - kafka
      - otel-collector

  resolution-consumer-240p:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: video-pipeline-backend:latest
    container_name: resolution-consumer-240p
    command: ["resolution-consumer"]
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RESOLUTION: 240p
      METRICS_PORT: "9100"
    depends_on:
      - kafka
      - otel-collector

  resolution-consumer-360p:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: video-pipeline-backend:latest
    container_name: resolution-consumer-360p
    command: ["resolution-consumer"]
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RESOLUTION: 360p
      METRICS_PORT: "9100"
    depends_on:
      - kafka
      - otel-collector

  resolution-consumer-480p:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: video-pipeline-backend:latest
    container_name: resolution-consumer-480p
    command: ["resolution-consumer"]
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RESOLUTION: 480p
      METRICS_PORT: "9100"
    depends_on:
      - kafka
      - otel-collector

  resolution-consumer-720p:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: video-pipeline-backend:latest
    container_name: resolution-consumer-720p
    command: ["resolution-consumer"]
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RESOLUTION: 720p
      METRICS_PORT: "9100"
    depends_on:
      - kafka
      - otel-collector

  final-consumer:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: video-pipeline-backend:latest
    container_name: final-consumer
    command: ["final-consumer"]
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      STORAGE_ROOT: /data
      METRICS_PORT: "9100"
    volumes:
      - video-storage:/data
    depends_on:
      - kafka
      - otel-collector

volumes:
  video-storage:
